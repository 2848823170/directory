name: Directory PR checks

on:
  pull_request:
    paths:
      - "directory.json"
      - "chains.json"
      - "app/**"
      - "components/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.js"
      - "tsconfig.json"
      - ".github/workflows/pr-checks.yml"

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm must be installed before setup-node, because setup-node's
      # pnpm cache looks up the pnpm store path.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Newest 22.x, so security releases apply even when the runner caches an older one.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate listing data
        run: pnpm run validate:data

      - name: Check formatting
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

  verify-endpoints:
    # Calls each new or changed listing's live endpoint: MCP must answer,
    # listed tools must exist, and an unpaid call must ask for x402 payment.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Newest 22.x, so security releases apply even when the runner caches an older one.
          check-latest: true

      - name: Load base directory.json
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show "origin/$BASE_REF:directory.json" > "$RUNNER_TEMP/base-directory.json"

      - name: Check new and changed listings
        run: node scripts/check-endpoints.mjs --changed "$RUNNER_TEMP/base-directory.json"
